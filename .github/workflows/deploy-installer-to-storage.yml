name: Build And Upload Installer

on:
  push:
    branches:
      - develop
    paths:
      - "McServerManager/**/*.cs"
      - "McServerManager/**/*.xaml"
      - "McServerManager/**/*.csproj"
      - "McServerManager/**/*.sln"
      - "McServerManager/installer/**"
      - "McServerManager/Resources/**"
      - "McServerManager/icon.ico"
      - "McServerManager/icon.png"
      - "McServerManager/icon-square.png"
      - "McServerManager/LICENSE.txt"
      - "McServerManager/THIRD_PARTY_NOTICES.txt"
      - ".github/workflows/deploy-installer-to-storage.yml"
  workflow_dispatch:

concurrency:
  group: deploy-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_installer:
    runs-on: windows-latest
    permissions:
      id-token: write   # OIDC for Azure Trusted Signing
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ── Phase 1: Publish (dotnet publish only) ──────────────────────────
      - name: Publish app
        shell: pwsh
        run: >
          .\McServerManager\installer\build.ps1
          -Phase Publish
          -Configuration Release
          -Runtime win-x64

      # ── Azure login (OIDC) for Trusted Signing ──────────────────────────
      - name: Azure login
        if: vars.TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ── Sign app binary before packaging ────────────────────────────────
      - name: Sign app binary (Trusted Signing)
        if: vars.TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: McServerManager\bin\Release\net8.0-windows\win-x64\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Phase 2: Package (ISCC + versioned copy, no manifest) ──────────
      - name: Package installer
        shell: pwsh
        run: >
          .\McServerManager\installer\build.ps1
          -Phase Package
          -Configuration Release
          -Runtime win-x64

      - name: Resolve app version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "McServerManager/McServerManager.csproj"
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version not found in McServerManager.csproj"
          }
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── Sign installer (both MaiPilotSetup.exe and versioned copy) ─────
      - name: Sign installer (Trusted Signing)
        if: vars.TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: McServerManager\installer\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Generate update manifest (hash of signed installer) ────────────
      - name: Generate update manifest
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          INSTALLER_BASE_URL: "https://stmailpilotje.blob.core.windows.net/public/downloads"
          RELEASE_NOTES_URL: "https://www.maipilot.jp/docs/"
        run: |
          $mainExe = "McServerManager\installer\dist\MaiPilotSetup.exe"
          if (-not (Test-Path $mainExe)) { throw "Installer not found: $mainExe" }

          $sha256 = (Get-FileHash $mainExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version         = $env:APP_VERSION
            installerUrl    = "$($env:INSTALLER_BASE_URL.TrimEnd('/'))/MaiPilotSetup-$env:APP_VERSION.exe"
            sha256          = $sha256
            publishedAt     = $publishedAt
            releaseNotesUrl = $env:RELEASE_NOTES_URL
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            "McServerManager\installer\dist\update.json",
            ($manifest | ConvertTo-Json),
            $utf8NoBom
          )
          Write-Host "Manifest generated: sha256=$sha256 version=$env:APP_VERSION"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            McServerManager/installer/dist/MaiPilotSetup.exe
            McServerManager/installer/dist/update.json
          if-no-files-found: error
          retention-days: 1

  upload_to_storage:
    needs: build_installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: ${{ runner.temp }}/installer_artifact

      - name: Validate Azure settings
        shell: bash
        run: |
          if [ -z "$AZURE_STORAGE_CONNECTION_STRING" ]; then
            echo "AZURE_STORAGE_CONNECTION_STRING is not set."
            exit 1
          fi

      - name: Upload installer to Blob Storage
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="${RUNNER_TEMP}/installer_artifact"
          VERSION="${{ needs.build_installer.outputs.app_version }}"
          FILE_PATH=$(find "$ARTIFACT_DIR" -type f -name "MaiPilotSetup.exe" | head -n 1 || true)
          if [ -z "$FILE_PATH" ]; then
            echo "MaiPilotSetup.exe artifact not found under $ARTIFACT_DIR"
            exit 1
          fi
          CONTAINER="public"
          PREFIX="downloads"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"

          if [ -n "$PREFIX" ]; then
            LATEST_BLOB="${PREFIX}/MaiPilotSetup.exe"
            VERSIONED_BLOB="${PREFIX}/MaiPilotSetup-${VERSION}.exe"
          else
            LATEST_BLOB="MaiPilotSetup.exe"
            VERSIONED_BLOB="MaiPilotSetup-${VERSION}.exe"
          fi

          az storage container create \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --name "$CONTAINER" \
            --public-access blob \
            --only-show-errors \
            -o none \
            1>/dev/null

          az storage container set-permission \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --name "$CONTAINER" \
            --public-access blob \
            --only-show-errors \
            -o none \
            1>/dev/null

          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$LATEST_BLOB" \
            --file "$FILE_PATH" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --overwrite true \
            1>/dev/null

          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$VERSIONED_BLOB" \
            --file "$FILE_PATH" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --overwrite true \
            1>/dev/null

          LATEST_URL=$(az storage blob url \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$LATEST_BLOB" \
            -o tsv)

          VERSIONED_URL=$(az storage blob url \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$VERSIONED_BLOB" \
            -o tsv)

          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          {
            echo "latest_url=$LATEST_URL"
            echo "versioned_url=$VERSIONED_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository for manifest sync
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.MANIFEST_SYNC_TOKEN != '' && secrets.MANIFEST_SYNC_TOKEN || github.token }}

      - name: Sync update manifest to landing
        id: sync_manifest
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="${RUNNER_TEMP}/installer_artifact"
          SOURCE_MANIFEST=$(find "$ARTIFACT_DIR" -type f -name "update.json" | head -n 1 || true)
          TARGET_DIR="McServerManager/landing/public/updates/win-x64"
          TARGET_MANIFEST="$TARGET_DIR/update.json"
          VERSION="${{ needs.build_installer.outputs.app_version }}"
          VERSIONED_URL="${{ steps.upload.outputs.versioned_url }}"
          RELEASE_NOTES_URL="https://www.maipilot.jp/docs/"

          mkdir -p "$TARGET_DIR"
          if [ -n "$SOURCE_MANIFEST" ] && [ -f "$SOURCE_MANIFEST" ]; then
            cp "$SOURCE_MANIFEST" "$TARGET_MANIFEST"
          else
            EXE_PATH=$(find "$ARTIFACT_DIR" -type f -name "MaiPilotSetup.exe" | head -n 1 || true)
            if [ -z "$EXE_PATH" ]; then
              echo "update.json artifact not found, and MaiPilotSetup.exe is also missing."
              exit 1
            fi

            SHA256=$(sha256sum "$EXE_PATH" | awk '{print $1}')
            PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            printf '%s\n' \
              '{' \
              "  \"version\": \"$VERSION\"," \
              "  \"installerUrl\": \"$VERSIONED_URL\"," \
              "  \"sha256\": \"$SHA256\"," \
              "  \"publishedAt\": \"$PUBLISHED_AT\"," \
              "  \"releaseNotesUrl\": \"$RELEASE_NOTES_URL\"" \
              '}' > "$TARGET_MANIFEST"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$TARGET_MANIFEST"; then
            echo "No manifest changes to commit."
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "$TARGET_MANIFEST"
          git commit -m "chore: sync app update manifest [skip ci]"
          git push origin HEAD:develop
          echo "manifest_changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger landing deploy
        if: steps.sync_manifest.outputs.manifest_changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MANIFEST_SYNC_TOKEN != '' && secrets.MANIFEST_SYNC_TOKEN || github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-landing-static-web-apps.yml',
              ref: 'develop'
            });
            console.log('Landing deploy triggered.');

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Installer uploaded"
            echo "- Version: \`${{ needs.build_installer.outputs.app_version }}\`"
            echo "- Container: \`${{ steps.upload.outputs.container }}\`"
            echo "- Latest: ${{ steps.upload.outputs.latest_url }}"
            echo "- Versioned: ${{ steps.upload.outputs.versioned_url }}"
            echo "- Manifest synced: McServerManager/landing/public/updates/win-x64/update.json"
          } >> "$GITHUB_STEP_SUMMARY"
