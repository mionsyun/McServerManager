name: Build And Upload Installer

on:
  push:
    branches:
      - develop
    paths:
      - "McServerManager/**/*.cs"
      - "McServerManager/**/*.xaml"
      - "McServerManager/**/*.csproj"
      - "McServerManager/**/*.sln"
      - "McServerManager/installer/**"
      - "McServerManager/Resources/**"
      - "McServerManager/icon.ico"
      - "McServerManager/icon.png"
      - "McServerManager/icon-square.png"
      - "McServerManager/LICENSE.txt"
      - "McServerManager/THIRD_PARTY_NOTICES.txt"
      - ".github/workflows/deploy-installer-to-storage.yml"
  workflow_dispatch:

concurrency:
  group: deploy-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_installer:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: >
          .\McServerManager\installer\build.ps1
          -Configuration Release
          -Runtime win-x64
          -PublicDownloadBaseUrl "https://stmailpilotje.blob.core.windows.net/public/downloads"
          -ReleaseNotesUrl "https://www.maipilot.jp/docs/"

      - name: Resolve app version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "McServerManager/McServerManager.csproj"
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version not found in McServerManager.csproj"
          }
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            McServerManager/installer/dist/MaiPilotSetup.exe
            McServerManager/installer/dist/update.json
          if-no-files-found: error
          retention-days: 14

  upload_to_storage:
    needs: build_installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: artifact

      - name: Validate Azure settings
        shell: bash
        run: |
          if [ -z "$AZURE_STORAGE_CONNECTION_STRING" ]; then
            echo "AZURE_STORAGE_CONNECTION_STRING is not set."
            exit 1
          fi

      - name: Upload installer to Blob Storage
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.build_installer.outputs.app_version }}"
          FILE_PATH=$(find artifact -type f -name "MaiPilotSetup.exe" | head -n 1 || true)
          if [ -z "$FILE_PATH" ]; then
            echo "MaiPilotSetup.exe artifact not found under ./artifact"
            exit 1
          fi
          CONTAINER="public"
          PREFIX="downloads"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"

          if [ -n "$PREFIX" ]; then
            LATEST_BLOB="${PREFIX}/MaiPilotSetup.exe"
            VERSIONED_BLOB="${PREFIX}/MaiPilotSetup-${VERSION}.exe"
          else
            LATEST_BLOB="MaiPilotSetup.exe"
            VERSIONED_BLOB="MaiPilotSetup-${VERSION}.exe"
          fi

          az storage container create \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --name "$CONTAINER" \
            --public-access blob \
            --only-show-errors \
            -o none \
            1>/dev/null

          az storage container set-permission \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --name "$CONTAINER" \
            --public-access blob \
            --only-show-errors \
            -o none \
            1>/dev/null

          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$LATEST_BLOB" \
            --file "$FILE_PATH" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --overwrite true \
            1>/dev/null

          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$VERSIONED_BLOB" \
            --file "$FILE_PATH" \
            --content-type "application/vnd.microsoft.portable-executable" \
            --overwrite true \
            1>/dev/null

          LATEST_URL=$(az storage blob url \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$LATEST_BLOB" \
            -o tsv)

          VERSIONED_URL=$(az storage blob url \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name "$CONTAINER" \
            --name "$VERSIONED_BLOB" \
            -o tsv)

          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          {
            echo "latest_url=$LATEST_URL"
            echo "versioned_url=$VERSIONED_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository for manifest sync
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.MANIFEST_SYNC_TOKEN != '' && secrets.MANIFEST_SYNC_TOKEN || github.token }}

      - name: Sync update manifest to landing
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_MANIFEST=$(find artifact -type f -name "update.json" | head -n 1 || true)
          TARGET_DIR="McServerManager/landing/public/updates/win-x64"
          TARGET_MANIFEST="$TARGET_DIR/update.json"
          VERSION="${{ needs.build_installer.outputs.app_version }}"
          VERSIONED_URL="${{ steps.upload.outputs.versioned_url }}"
          RELEASE_NOTES_URL="https://www.maipilot.jp/docs/"

          mkdir -p "$TARGET_DIR"
          if [ -n "$SOURCE_MANIFEST" ] && [ -f "$SOURCE_MANIFEST" ]; then
            cp "$SOURCE_MANIFEST" "$TARGET_MANIFEST"
          else
            EXE_PATH=$(find artifact -type f -name "MaiPilotSetup.exe" | head -n 1 || true)
            if [ -z "$EXE_PATH" ]; then
              echo "update.json artifact not found, and MaiPilotSetup.exe is also missing."
              exit 1
            fi

            SHA256=$(sha256sum "$EXE_PATH" | awk '{print $1}')
            PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            printf '%s\n' \
              '{' \
              "  \"version\": \"$VERSION\"," \
              "  \"installerUrl\": \"$VERSIONED_URL\"," \
              "  \"sha256\": \"$SHA256\"," \
              "  \"publishedAt\": \"$PUBLISHED_AT\"," \
              "  \"releaseNotesUrl\": \"$RELEASE_NOTES_URL\"" \
              '}' > "$TARGET_MANIFEST"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$TARGET_MANIFEST"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add "$TARGET_MANIFEST"
          git commit -m "chore: sync app update manifest"
          git push origin HEAD:develop

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## Installer uploaded"
            echo "- Version: \`${{ needs.build_installer.outputs.app_version }}\`"
            echo "- Container: \`${{ steps.upload.outputs.container }}\`"
            echo "- Latest: ${{ steps.upload.outputs.latest_url }}"
            echo "- Versioned: ${{ steps.upload.outputs.versioned_url }}"
            echo "- Manifest synced: McServerManager/landing/public/updates/win-x64/update.json"
          } >> "$GITHUB_STEP_SUMMARY"
