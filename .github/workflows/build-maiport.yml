name: Build MaiPort

on:
  push:
    branches:
      - "**"
    paths:
      - "MaiPort/**"
      - "MaiPort.Tests/**"
      - ".github/workflows/build-maiport.yml"
  pull_request:
    paths:
      - "MaiPort/**"
      - "MaiPort.Tests/**"
      - ".github/workflows/build-maiport.yml"
  workflow_dispatch:

concurrency:
  group: build-maiport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore MaiPort/MaiPort.csproj
          dotnet restore MaiPort.Tests/MaiPort.Tests.csproj

      - name: Build
        shell: pwsh
        run: dotnet build MaiPort/MaiPort.csproj -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test MaiPort.Tests/MaiPort.Tests.csproj -c Release --logger "trx;LogFileName=maiport-tests.trx"

      - name: Publish (self-contained single exe)
        shell: pwsh
        run: >
          dotnet publish MaiPort/MaiPort.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/maiport-selfcontained

      - name: Publish (framework-dependent single exe)
        shell: pwsh
        run: >
          dotnet publish MaiPort/MaiPort.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o dist/maiport-framework-dependent

      - name: Report exe info
        shell: pwsh
        run: |
          foreach ($exe in @("dist/maiport-selfcontained/MaiPort.exe", "dist/maiport-framework-dependent/MaiPort.exe")) {
            if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
            $item = Get-Item $exe
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $sizeMb = [math]::Round($item.Length / 1MB, 1)
            $line = "- " + $exe + " : " + $sizeMb + " MB / sha256=" + $hash
            Write-Host $line
            $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload self-contained exe
        uses: actions/upload-artifact@v4
        with:
          name: MaiPort-win-x64-selfcontained
          path: dist/maiport-selfcontained/MaiPort.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload framework-dependent exe
        uses: actions/upload-artifact@v4
        with:
          name: MaiPort-win-x64-framework-dependent
          path: dist/maiport-framework-dependent/MaiPort.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaiPort-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
