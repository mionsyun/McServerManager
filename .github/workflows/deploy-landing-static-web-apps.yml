name: Deploy Landing To Azure Static Web Apps

on:
  push:
    branches:
      - develop
      # Temporary release-preview trigger; remove before merging.
      - codex/maipilot-conversion-20261003
    paths:
      - "McServerManager/landing/**"
      - ".github/workflows/deploy-landing-static-web-apps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-swa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: McServerManager/landing/.nvmrc
          cache: npm
          cache-dependency-path: McServerManager/landing/package-lock.json

      - name: Show runtime versions
        working-directory: McServerManager/landing
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: McServerManager/landing
        run: npm ci

      - name: Read app version from manifest
        id: read_version
        run: |
          VERSION=$(jq -r '.version' McServerManager/landing/public/updates/win-x64/update.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate static site
        working-directory: McServerManager/landing
        env:
          # ダウンロード URL は nuxt.config.ts の既定値だけで管理する（GitHub Variable で上書きしない）。
          # 以前は vars.NUXT_PUBLIC_DOWNLOAD_URL で上書きしていたが、インフラ移行時に古い値が残って
          # LP のリンクが無効なストレージを指したため、参照をやめた。
          NUXT_PUBLIC_APP_VERSION: ${{ steps.read_version.outputs.version }}
        run: npm run generate

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: develop
          skip_app_build: true
          app_location: McServerManager/landing/.output/public


