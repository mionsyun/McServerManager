name: Deploy Landing To Azure Static Web Apps

on:
  push:
    branches:
      - develop
    paths:
      - "McServerManager/landing/**"
      - ".github/workflows/deploy-landing-static-web-apps.yml"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - develop
    paths:
      - "McServerManager/landing/**"
      - ".github/workflows/deploy-landing-static-web-apps.yml"

concurrency:
  group: deploy-landing-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: McServerManager/landing/package-lock.json

      - name: Install dependencies
        working-directory: McServerManager/landing
        run: npm ci

      - name: Generate static site
        working-directory: McServerManager/landing
        env:
          NUXT_PUBLIC_DOWNLOAD_URL: ${{ vars.NUXT_PUBLIC_DOWNLOAD_URL || 'https://stmailpilotje.blob.core.windows.net/public/downloads/MaiPilotSetup.exe' }}
        run: npm run generate

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: develop
          skip_app_build: true
          app_location: McServerManager/landing/.output/public

  close_preview_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LP }}
          action: close
