name: Deploy Landing To Azure Static Web Apps

on:
  push:
    branches:
      - develop
    paths:
      - "McServerManager/landing/**"
      - ".github/workflows/deploy-landing-static-web-apps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing-swa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: McServerManager/landing/.nvmrc
          cache: npm
          cache-dependency-path: McServerManager/landing/package-lock.json

      - name: Show runtime versions
        working-directory: McServerManager/landing
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: McServerManager/landing
        run: npm ci

      - name: Generate static site
        working-directory: McServerManager/landing
        env:
          NUXT_PUBLIC_DOWNLOAD_URL: ${{ vars.NUXT_PUBLIC_DOWNLOAD_URL || 'https://stmailpilotje.blob.core.windows.net/public/downloads/MaiPilotSetup.exe' }}
        run: npm run generate

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          production_branch: develop
          skip_app_build: true
          app_location: McServerManager/landing/.output/public


